<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wandgraft Wand Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside id="bench" aria-label="Wand bench"></aside>
      <main id="range">
        <canvas id="scene" aria-label="Firing range"></canvas>
        <div id="labels" aria-hidden="true"></div>
        <div id="hud">
          <div class="meter" id="charge-meter"><span class="meter-name">Charge</span><div class="bar"><i></i></div><span class="meter-value"></span></div>
          <div class="meter" id="heat-meter"><span class="meter-name">Heat</span><div class="bar"><i></i><b class="limit"></b></div><span class="meter-value"></span></div>
          <p class="hint">WASD to move. Hold left click to fire. B hides the bench.</p>
        </div>
        <div id="toast" role="status" aria-live="polite"></div>
      </main>
      <aside id="side" aria-label="Range controls and damage log"></aside>
    </div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
